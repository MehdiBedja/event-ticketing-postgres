name: SQL tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sgbd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sgbd_test
    steps:
      - uses: actions/checkout@v4
      - name: Load schema and functions
        run: psql -v ON_ERROR_STOP=1 -q -f SGBD_sql.sql
      - name: Run tests
        run: psql -v ON_ERROR_STOP=1 -q -f tests/test_functions.sql
